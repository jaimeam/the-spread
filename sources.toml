# Source list for The Spread.
#
# type:       rss | ofac | gdelt | google_news | palladian
# public_ok:  true  = safe to summarise in a public edition (free / official / primary)
#             false = only for your private brief (e.g. your own paid subscriptions,
#                     or headline-only aggregators of paywalled outlets)
# segments:   hint for the tagger: upstream, midstream, refining, petchem, gas_lng,
#             shipping, geopolitics, macro
# local_only: true = skipped on GitHub Actions (the site blocks GitHub's servers), used in local runs
#
# Feed URLs below were checked on 2026-10-12. If one dies, the pipeline warns (visible on the
# Actions run page) and moves on. Short feeds (OilPrice keeps 15 items, Splash 10) roll over in
# under a day, so ingest.yml polls every source every few hours between briefs.
# Some sites block requests from GitHub's servers: those are marked local_only = true.

# ---------- Official data & agencies ----------

[[source]]
name = "EIA - Today in Energy"
type = "rss"
url = "https://www.eia.gov/rss/todayinenergy.xml"
public_ok = true
segments = ["macro", "refining", "gas_lng"]

