# Started by trigger/test.sh to check the mini PC trigger end to end.
# Does nothing else: no secrets, no checkout, no commits, no credits.
name: Trigger test

on:
  workflow_dispatch:
    inputs:
      skip_if_done:          # same input the daily dispatch sends
        type: boolean
        default: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Started by ${{ github.actor }} via ${{ github.event_name }}, skip_if_done=${{ inputs.skip_if_done }}"
