# Runs every weekday morning: brief -> podcast episode -> feed, then publishes site/ to GitHub Pages.
# Secrets to add (repo -> Settings -> Secrets and variables -> Actions):
#   ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID                        (required)
#   ANTHROPIC_API_KEY and/or MISTRAL_API_KEY                       (whichever providers you use)
#   EIA_API_KEY, AGSI_API_KEY                                      (optional)
# Models (optional, Settings -> Secrets and variables -> Actions -> Variables tab):
#   TAG_MODEL, BRIEF_MODEL, SCRIPT_MODEL as "provider:model", e.g. mistral:mistral-small-latest
# Then: Settings -> Pages -> Source: GitHub Actions.

name: The Spread daily

on:
  # The owner's mini PC makes the episode at 04:41 UTC (trigger/the-spread-run) and pushes it.
  # This is only the fallback if it didn't: it does nothing if today's episode already exists.
  # The mini PC won't start after 05:15 UTC, so the two never overlap. GitHub can start it hours late.
  schedule:
    - cron: "47 5 * * 1-5"
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      dry_run:
        description: "Dry run: write the brief and script only (no audio, nothing published). Download them under the run's Artifacts."
        type: boolean
        default: false
      skip_if_done:
        description: "Do nothing if today's episode already exists (set by an external scheduler)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: the-spread
  cancel-in-progress: false

jobs:
  # Scheduled runs (and dispatches with skip_if_done) skip a day that's already done:
  # the backup slot, a late scheduled run, or after a manual run. Other manual runs go ahead.
  # Checkout uses the branch tip, not the commit the event was created on: GitHub can deliver
  # both slots hours late and together, and the second must see the first one's brief.
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - id: check
        run: |
          if { [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.skip_if_done }}" = true ]; } \
             && [ -f "briefs/$(date -u +%F)-public.md" ]; then
            echo "Today's brief is already published; nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: ${{ needs.check.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      TAG_MODEL: ${{ vars.TAG_MODEL }}
      BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
      SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      BRIEF_DB: state/public.db   # public-only item history, committed between runs
      PODCAST_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # branch tip: latest state/public.db, and the push won't be rejected

      - run: mkdir -p state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Public edition only: everything this job produces is published on the open web.
      # Monday's brief covers the weekend too (78h instead of 30h).
      - name: Write today's brief
        run: |
          HOURS=$([ "$(date -u +%u)" = 1 ] && echo 78 || echo 30)
          python pipeline.py run --public --require-llm --hours "$HOURS"

      - name: Make the episode and feed
        run: python podcast.py episode "briefs/$(date -u +%F)-public.md" ${{ inputs.dry_run && '--script-only' || '' }}

      - name: Keep the dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            briefs/*-public.md
            scripts/

      - name: Save to the repo
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "the-spread-bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefs scripts site state
          git commit -m "Brief $(date -u +%F)" || echo "nothing to commit"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
